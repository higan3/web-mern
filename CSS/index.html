<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Css</title>


    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        padding: 10px;
      }

      .bx {
        height: 400px;
        width: 400px;
        border: 1px solid black;
        background-image: url('https://images.unsplash.com/photo-1749936336802-29c1d8fd40a4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyM3x8fGVufDB8fHx8fA%3D%3D');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: right 35% bottom 15%;
        padding: 100px;


      }

      .c-bx {
        backdrop-filter: blur(120px);
      }
    </style>

  </head>

  <body>

    <div class="bx">

      <div class="c-bx">
        <h1>Hello jee</h1>
      </div>

    </div>





    </div>


  </body>

</html>
